name: Build PhotoCraft Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photocraft-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  TRUNK_VERSION: "0.21.14"

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the port
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: photocraft-android-wasm-v1
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install Trunk
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version

      - name: Build the Rust core and egui UI as WebAssembly
        working-directory: apps/photocraft-web
        run: trunk build --release

      - name: Copy web build into the APK and inject the Android bridge
        run: python3 scripts/assemble_web_assets.py

      - name: Read the upstream version
        run: |
          VERSION=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          test -n "$VERSION"
          echo "PHOTOCRAFT_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "PHOTOCRAFT_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building PhotoCraft $VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/photocraft-release.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            ALIAS="${KEY_ALIAS:-photocraft}"
            STORE_PASS="${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD must be set with the keystore}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
            echo "Using the repository release keystore."
          else
            ALIAS="photocraft"
            STORE_PASS="$(openssl rand -base64 24)"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=PhotoCraft Android, O=HakaI963, C=US"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; this APK is signed with an ephemeral key."
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and name the APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/PhotoCraft-Android-${PHOTOCRAFT_VERSION_NAME}.apk"
          (cd out && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -lh out/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-${{ env.PHOTOCRAFT_VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      - name: Publish / update the GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v${PHOTOCRAFT_VERSION_NAME}"
          TITLE="PhotoCraft for Android ${PHOTOCRAFT_VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TITLE" \
              --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
          fi
          gh release upload "$TAG" out/*.apk out/SHA256SUMS.txt --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
