name: Smoke test on Android emulator

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        default: android-v0.14.0

permissions:
  contents: read

jobs:
  emulator:
    name: Install and launch the release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download the release APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p apk
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk
          ls -lh apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot, install, launch, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -r apk/*.apk || true
            adb shell am start -W -n io.github.hakai963.photocraft/.MainActivity || true
            sleep 150
            adb shell dumpsys activity activities > dumpsys.txt || true
            grep -E 'mResumedActivity|topResumedActivity' dumpsys.txt || true
            adb shell screencap -p /sdcard/photocraft-150.png || true
            adb pull /sdcard/photocraft-150.png . || true
            sleep 45
            adb shell screencap -p /sdcard/photocraft-195.png || true
            adb pull /sdcard/photocraft-195.png . || true
            # Touch chrome on a 1080x2400 Pixel 6: the hamburger is at the top-left.
            adb shell input tap 85 134 || true
            sleep 2
            adb shell screencap -p /sdcard/photocraft-menu.png || true
            adb pull /sdcard/photocraft-menu.png . || true
            # New is the first quick action in the command sheet.
            adb shell input tap 160 350 || true
            sleep 2
            adb shell screencap -p /sdcard/photocraft-new.png || true
            adb pull /sdcard/photocraft-new.png . || true
            # Create the default 1920x1080 document from the mobile New sheet.
            adb shell input tap 538 1660 || true
            sleep 15
            adb shell screencap -p /sdcard/photocraft-new-document.png || true
            adb pull /sdcard/photocraft-new-document.png . || true
            # The Panels button at the top-right opens the Layers sheet.
            adb shell input tap 999 134 || true
            sleep 3
            adb shell screencap -p /sdcard/photocraft-panels.png || true
            adb pull /sdcard/photocraft-panels.png . || true
            adb shell input tap 999 134 || true
            sleep 1
            # Brush on the bottom strip, and the large brush-size stepper above it.
            adb shell input tap 848 2244 || true
            sleep 2
            adb shell screencap -p /sdcard/photocraft-brush.png || true
            adb pull /sdcard/photocraft-brush.png . || true
            # Menu -> Open exercises rfd's web file dialog through Android's picker.
            adb shell input tap 85 134 || true
            sleep 2
            adb shell input tap 413 350 || true
            sleep 8
            adb shell screencap -p /sdcard/photocraft-picker.png || true
            adb pull /sdcard/photocraft-picker.png . || true
            # The picker's first recent row is one of the screenshots taken above. Selecting it
            # exercises the content:// URI -> FileReader -> Rust PNG decode -> canvas path.
            adb shell input tap 350 520 || true
            sleep 20
            adb shell screencap -p /sdcard/photocraft-document.png || true
            adb pull /sdcard/photocraft-document.png . || true
            adb logcat -d > logcat.txt || true
            grep -iE 'photocraft|chromium|AndroidRuntime|FATAL|WebView' logcat.txt | tail -250 || true

      - name: Upload the screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            photocraft-*.png
            logcat.txt
            dumpsys.txt
          if-no-files-found: warn
